[project]
name = "creo-native-sop"
version = "0.1.0"
description = "Auditable, review-gated Creo-native assembly SOP pipeline"
requires-python = ">=3.11"
dependencies = [
  "dashscope>=1.24",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "Pillow>=10",
  "PySide6>=6.8",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
qwen-creo-sop-agent = "sop_pipeline.desktop.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
